<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

<title>CRM Companion Today View v3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<!-- Styles, grouped by feature. Order matters: base first, responsive last. -->

<link rel="stylesheet" href="src/pages/today/today.css">
<link rel="stylesheet" href="src/pages/problem-statement/problem-statement.css">

<body>
<div class="app">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">C</div>
      <div class="brand-text"><b>CRM Companion</b><span>Workspace</span></div>
      <button type="button" class="nav-toggle" id="hideNavBtn" aria-label="Hide sidebar" title="Hide sidebar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
    </div>
    <nav class="sidenav" aria-label="Main">
      <p class="navlabel" id="navWorkspaceLabel">Workspace</p>
      <ul class="navlist" aria-labelledby="navWorkspaceLabel">
        <li><a class="navitem active" id="navTodayLink" href="#today" data-nav="today" aria-current="page">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 9h18"/></svg>
          Today <span class="count" id="navCount" aria-label="follow-ups left">6</span></a></li>
        <li><a class="navitem" id="navHistoryLink" href="#history" data-nav="history">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
          Activity history</a></li>
        <li><a class="navitem" id="navProblemLink" href="#problem" data-nav="problem">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg>
          Problem statement</a></li>
      </ul>
      <p class="navlabel" id="navAdminLabel">Admin</p>
      <ul class="navlist" aria-labelledby="navAdminLabel">
        <li><a class="navitem" id="navAdminLink" href="#admin" data-nav="admin">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          Admin — Code Explorer</a></li>
      </ul>
    </nav>
    <div class="sidefoot">
      <div class="samplebox">
        <b>Prototype workspace</b>
        <p id="sampleNotice">Sample data · resets on reload. Calls and emails are simulated.</p>
      </div>
      <div class="userrow">
        <div class="avatar" aria-hidden="true">AR</div>
        <div><b>Alex Rivera</b><span>Sales representative</span></div>
      </div>
    </div>
  </aside>

  <!-- Main -->
  <button type="button" class="show-nav" id="showNavBtn" aria-label="Show sidebar" title="Show sidebar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg> Menu</button>
  <main class="main" id="appMain"></main>
</div>
